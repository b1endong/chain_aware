services:
  db:
    image: postgres:16
    container_name: training-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: training
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data          # dữ liệu được giữ lại khi tắt container
      - ./db:/docker-entrypoint-initdb.d:ro  # file .sql trong thư mục này chạy lần khởi tạo đầu tiên

  pgadmin:                                       # tùy chọn: giao diện web để xem bảng
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: